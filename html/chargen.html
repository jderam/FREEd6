<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEd6 Character Generator</title>
    <link rel="stylesheet" href="free_d6.css">
</head>
<body>
    <div id="app" class="container">
        <div class="left-col"></div>
        <div class="center-col">
            <div class="item banner">
                <img src="img/3d6.jpg" height="74px" style="transform: scaleX(-1);">
                &nbsp;&nbsp;
                FREEd6
                &nbsp;&nbsp;
                <img src="img/3d6.jpg" height="74px">
            </div>
            <div class="item name"><b>Name</b>: <span id="name"></span></div>
            <div class="item level"><b>Level</b>: <span id="level"></span></div>
            <div class="item hit-points"><b>Hit Points</b>: <span id="hit-points"></span></div>
            <div class="item background"><b>Background</b>: <span id="background"></span></div>
            <div class="item skills"><b><u>Skills</u></b>
                <ul id="skills"></ul>
            </div>
            <div class="item extraordinary-abilities"><b><u>Extraordinary Abilities</u></b>
                <ul id="extraordinary-abilities"></ul>
            </div>
            <div class="item weapon"><b><u>Weapons</u></b>
                <ul id="weapon"></ul>
            </div>
            <div class="item equipment"><b><u>Equipment</u></b>
                <ul id="equipment"></ul>
            </div>
            <div class="item money">
                <b>Money</b>: <span id="money"></span> sp
            </div>
            <div class="item spells" id="spells-section" hidden>
                <b><u>Spells</u></b>
                <ul id="spells"></ul>
            </div>
        </div>
        <div class="right-col"></div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/zothique_names.js"></script>
    <script src="js/chargen.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
